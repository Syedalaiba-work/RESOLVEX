name: nascon-league

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nascon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nascon_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-nascon}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nascon}:${POSTGRES_PASSWORD:-nascon_local_dev}@db:5432/${POSTGRES_DB:-nascon}
      JWT_SECRET: ${JWT_SECRET:-}
      # Part II 5.1: /health also checks these when set.
      REDIS_URL: redis://redis:6379/0
      MEDIA_API_URL: http://media:9997
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      media:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nascon}:${POSTGRES_PASSWORD:-nascon_local_dev}@db:5432/${POSTGRES_DB:-nascon}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ---- Part II (Day 2) services -------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # Media server (Part II 6.1): RTMP 1935, HLS 8888, WebRTC WHIP/WHEP 8889. The image has no shell,
  # so readiness is checked by the API's /health through MediaMTX's control API (port 9997).
  media:
    image: bluenviron/mediamtx:1.9.1
    environment:
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
    restart: unless-stopped

  # Object store for stream recordings (Part II 1.3). BLOCKED on 2026-10-18: the pinned
  # minio/minio:RELEASE.2024-09-22T00-33-43Z cannot be pulled (Docker Hub: "pull access denied";
  # quay.io: 401). Left out so `docker compose up` still starts; see docs/DAY2_COMPOSE_PLAN.md.
  # minio:
  #   image: minio/minio:RELEASE.2024-09-22T00-33-43Z

  # Selenium Grid 4: hub + 3 browser nodes (Part II 6.2.1), images from the pre-pulled bundle.
  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status | grep -q '\"ready\": *true'"]
      interval: 5s
      timeout: 3s
      retries: 30

  node-chrome-1: &selenium-node
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"
    depends_on: [selenium-hub]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_START_VNC=false

  node-chrome-2:
    <<: *selenium-node

  node-firefox:
    <<: *selenium-node
    image: selenium/node-firefox:4.24.0

volumes:
  db_data:
