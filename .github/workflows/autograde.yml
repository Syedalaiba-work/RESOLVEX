# Part II sec 1.3: runs on every push to main - commit ancestry, backend contract tests, Selenium Grid 4
# node verification and a k6 smoke check. Salts come from repository secrets (Settings > Secrets and
# variables > Actions: DAY1_SALT, DAY2_SALT); they are never written in this file.
name: autograde

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DAY1_BASE_SHA: f6d03c3470c7f497474a89500a3e4f6882025c53
  DAY1_SALT: ${{ secrets.DAY1_SALT }}
  DAY2_SALT: ${{ secrets.DAY2_SALT }}

jobs:
  autograde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Phase I ancestry (Part II sec 1.2)
        run: git merge-base --is-ancestor "$DAY1_BASE_SHA" HEAD

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for /health (120 s budget)
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 2
          done
          docker compose ps; docker compose logs api | tail -100; exit 1

      - name: Backend contract and regression tests
        run: |
          mkdir -p tests/reports
          docker compose exec -T api python -m pytest -q --junitxml=/tmp/backend-report.xml
          docker compose cp api:/tmp/backend-report.xml tests/reports/backend-report.xml

      - name: Baseline reset probe
        run: |
          curl -fsS -X POST http://localhost:8080/audit/v1/reset -H 'Content-Type: application/json' -d '{}'

      - name: Selenium Grid 4 - ready with at least 3 nodes
        run: |
          for i in $(seq 1 60); do
            n=$(curl -fsS http://localhost:4444/status | python3 -c "import json,sys; v=json.load(sys.stdin)['value']; print(len(v['nodes']) if v['ready'] else 0)" 2>/dev/null || echo 0)
            [ "$n" -ge 3 ] && echo "grid ready with $n nodes" && exit 0
            sleep 2
          done
          echo "grid not ready with >= 3 nodes"; exit 1

      - name: Selenium guest-player suite
        run: |
          python3 -m pip install -q selenium==4.24.0 pytest==8.4.1 pytest-xdist==3.6.1
          GRID_URL=http://localhost:4444 APP_URL=http://host.docker.internal:8080 API_URL=http://localhost:8080 \
            python3 -m pytest -n 3 tests/selenium/ --junitxml=tests/reports/selenium-report.xml

      - name: k6 load profile (NFR-2)
        run: |
          docker run --rm --network host -v "$PWD/tests:/tests" grafana/k6:0.54.0 \
            run --summary-export=/tests/reports/k6-summary.json /tests/k6_load.js

      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/reports/
